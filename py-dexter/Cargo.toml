[package]
name = "py-dexter"
version = "0.2.0-pre.3"
license.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation.workspace = true
description = "Python wrappers"

[lib]
name = "dexter"
crate-type = ["cdylib"]
test = false # linker issues, not needed anyway
bench = false

[dependencies]
dexter.workspace = true
ndarray.workspace = true
parabola.workspace = true
rsl-interpolation.workspace = true
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py314", "multiple-pymethods"] }
numpy = { version = "0.29.0" }

[features]
default = []
openblas-static = ["dexter/openblas-static"]
netcdf-static = ["dexter/netcdf-static"]
